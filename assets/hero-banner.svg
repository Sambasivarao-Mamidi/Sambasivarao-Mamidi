<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="Sambasivarao-Mamidi — UI Engineer • Frontend Developer • Vishakhapatnam">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0b0f19"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.25"/>

  <g filter="url(#glow)">
    <circle cx="120" cy="110" r="90" fill="#22d3ee" opacity="0.08"/>
    <circle cx="680" cy="110" r="110" fill="#a78bfa" opacity="0.06"/>
  </g>

  <text x="40" y="75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">
    Sambasivarao-Mamidi
  </text>

  <text x="40" y="115" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="2">
    UI Engineer  •  Frontend Developer  •  Turning Logic Into Art
  </text>

  <text x="40" y="145" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">
    Vishakhapatnam  •  https://sambasivarao-mamidi.vercel.app
  </text>

  <line x1="40" y1="175" x2="320" y2="175" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
  <line x1="320" y1="175" x2="800" y2="175" stroke="#1f2937" stroke-width="1"/>

  <text x="40" y="200" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">
    $ whoami  •  $ cat about.txt  •  $ ls projects
  </text>
</svg>
